# es-thermald core configuration file
# Format: key=value, section name [xxx] distinguishes different domains
# Support direct modification via sed command, e.g.:
# sed -i "s/^log_level.*/log_level=6/" /etc/es-thermald-ebc7702-u01.conf
# sed -i '/^\[mode_balanced\]/,/^\[/{s/^trip_point_0_temp=.*/trip_point_0_temp=64000/}' /etc/es-thermald-ebc7702-u01.conf
# Modifications will be automatically reloaded, no need to restart the process

# ====================Global Common Configuration====================
[global]
# set log level (3=ERR, 4=WARNING, 5=NOTICE, 6=INFO, 7=DEBUG)
log_level=5

# save log to file through syslog (0=no, other=yes)
save_log_to_file=0

# print temperature intervals, the unit is milliseconds (0=no, other=interval)
print_temp_intv=0

# limit cpu freq by npu model weight (0=no, other=target freq in kHz, e.g. 1400000=1.4GHz)
limit_cpufreq=1400000

# limit npu freq by npu model weight (0=no, other=target freq in Hz, e.g. 1040000000=1.04GHz)
limit_npufreq=0

# control fan speed (0=no, other=yes)
control_fan=1

# minimum fan pwm duty cycle (0~99, fan lowest speed limit)
min_pwm=10

# maximum fan pwm duty cycle (0~99, fan highest speed limit)
max_pwm=99

# pid controller base pwm duty cycle (0~99, min_pwm < pid_base_pwm < max_pwm)
pid_base_pwm=20

# set target temperature (unit is millicelsius)
single_die_target_temp=45000
dual_die_target_temp=50000

# battery capacity that triggers frequency limitation (0=no, other=capacity)
battery_trigger_freq_limit=0

# enable eswin thermal daemon governor (0=no, other=yes)
enable_thd_governor=1

# set current mode index
current_mode_idx=0

# ====================Mode Common Configuration====================
# balanced mode
[mode_balanced]
mode_idx=0
trip_point_0_temp=60000
trip_point_1_temp=70000
trip_point_2_temp=80000

# performance mode
[mode_performance]
mode_idx=1
trip_point_0_temp=65000
trip_point_1_temp=75000
trip_point_2_temp=80000

# power saving mode
[mode_power_saving]
mode_idx=2
trip_point_0_temp=55000
trip_point_1_temp=65000
trip_point_2_temp=80000

